name: vtracer_android
description: "VTracer for Android — raster to vector (SVG) conversion."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  vtracer: ^1.0.0-alpha.4
  visioncortex: ^0.9.3
  flutter_svg: ^2.3.0
  image_picker: ^1.2.1
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  generate: true

resolution: workspace
