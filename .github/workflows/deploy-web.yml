name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/vtracer_app/**"
      - "packages/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get
        working-directory: apps/vtracer_app

      - name: Build web
        run: flutter build web --release --base-href=/vtracer-dart/
        working-directory: apps/vtracer_app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/vtracer_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
